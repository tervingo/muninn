# Configuración de despliegue en Netlify para el frontend de Muninn.
# En el panel de Netlify: Base directory = frontend

[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

# --- RECOMENDADO: proxy de la API en el mismo dominio ---
# Reenvía /api/* al backend de Render. Así las cookies de sesión son "first-party"
# (mismo origen que el frontend), lo que EVITA el bloqueo de cookies de terceros de
# Safari iOS. Con este proxy, deja VITE_API_URL vacío (cadena vacía) en Netlify y pon
# WEBAUTHN_RP_ID / WEBAUTHN_ORIGIN al dominio de Netlify.
# Si tu servicio de Render tiene otra URL, cámbiala aquí.
[[redirects]]
  from = "/api/*"
  to = "https://muninn-backend.onrender.com/api/:splat"
  status = 200
  force = true

# Fallback SPA (react-router). El archivo public/_redirects hace lo mismo;
# se deja aquí por si se despliega sin él. Debe ir DESPUÉS del proxy /api.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
